<!DOCTYPE html>
<html>
<head>
  <title>TabMind</title>
  <style>
    body { font-family: Arial; width: 280px; padding: 12px; }
    h3 { margin: 0 0 10px; }
    textarea { width: 100%; height: 70px; margin-bottom: 10px; }
    label { font-size: 12px; color: #333; display: block; margin-bottom: 6px; }
    input[type="datetime-local"] { width: 100%; padding: 8px; margin-bottom: 10px; }
    button { width: 100%; padding: 10px; border: none; cursor: pointer; border-radius: 8px; margin-bottom: 8px; }
    .primary { background: #1976d2; color: white; }
    .secondary { background: #2e7d32; color: white; }
    #status { margin-top: 6px; font-size: 12px; color: green; min-height: 16px; }
    .hint { font-size: 11px; color: #666; margin-top: -6px; margin-bottom: 10px; }
  </style>
</head>
<body>

  <h3>Save This Tab</h3>

  <textarea id="note" placeholder="Why did you open this?"></textarea>

  <label for="remindAt">Remind me at (optional)</label>
  <input id="remindAt" type="datetime-local" />
  <div class="hint">Leave empty if you don’t want a reminder.</div>

  <button class="primary" id="saveBtn">Save (No Reminder)</button>
  <button class="secondary" id="saveWithReminderBtn">Save + Reminder</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
