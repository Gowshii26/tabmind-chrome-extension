<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>TabMind Dashboard</title>
  <style>
    body { font-family: Arial; padding: 16px; max-width: 900px; margin: 0 auto; }
    h1 { margin-bottom: 6px; }
    .sub { color: #666; margin-bottom: 16px; }

    .row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    input, select { padding: 10px; }
    #search { flex: 1; min-width: 220px; }
    #statusFilter { min-width: 160px; }

    .tab { border: 1px solid #ddd; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .title { font-weight: 700; margin-bottom: 6px; }
    .meta { font-size: 12px; color: #666; margin-bottom: 8px; word-break: break-all; }
    .note { margin-bottom: 10px; }

    .pill {
      display: inline-block; font-size: 12px; padding: 4px 8px; border-radius: 999px;
      background: #f1f1f1; color: #333; margin-right: 6px;
    }
    .pill.warn { background: #fff3cd; }
    .pill.ok { background: #e7f6e7; }

    .btns { display: flex; gap: 8px; flex-wrap: wrap; }
    button { padding: 8px 10px; border: none; cursor: pointer; border-radius: 8px; }
    .open { background: #1976d2; color: white; }
    .done { background: #2e7d32; color: white; }
    .snooze { background: #6a1b9a; color: white; }
    .clear { background: #455a64; color: white; }
    .del { background: #d32f2f; color: white; }

    .empty { color: #666; padding: 20px 0; }
  </style>
</head>
<body>
  <h1>TabMind</h1>
  <div class="sub">Your saved tabs with purpose (Intent Inbox)</div>

  <div class="row">
    <input id="search" placeholder="Search by title / url / note..." />
    <select id="statusFilter">
      <option value="all">All</option>
      <option value="active" selected>Active</option>
      <option value="done">Done</option>
      <option value="archived">Archived</option>
    </select>
  </div>

  <div id="list"></div>

  <script src="options.js"></script>
</body>
</html>
